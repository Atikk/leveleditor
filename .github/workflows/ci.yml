name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x' ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint no-ui-core-namespace
        run: |
          # Search tracked files under DotGame/ for 'namespace DotGame.Core' and fail if any are found.
          git ls-files 'DotGame/**' | xargs -r grep -n --color=never '^namespace DotGame\.Core' || true
          if git ls-files 'DotGame/**' | xargs -r grep -n --color=never '^namespace DotGame\.Core' | grep -q .; then
            echo "ERROR: Found files in DotGame/ that declare 'namespace DotGame.Core'."
            echo "Please move domain types to the DotGame.Core project or rename the namespace in UI code."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore
        run: dotnet restore leveleditor.sln

      - name: Build
        run: dotnet build leveleditor.sln --configuration Release --no-restore

      - name: Run tests
        env:
          DOTGAME_RUNTIME_HEADLESS: '1'
          DOTNET_CLI_TELEMETRY_OPTOUT: '1'
        run: dotnet test leveleditor.sln --configuration Release --no-build --verbosity normal
